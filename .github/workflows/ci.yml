name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy step (simulated)
        run: echo "Deploying application... Deployment successful!"